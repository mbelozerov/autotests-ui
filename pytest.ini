[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    regression: Маркировка для регрессионных автотестов
    registration: Маркировка для автотестов на регистрацию
    smoke: Маркировка для смоук автотестов
    authorization: Маркировка для автотестов на авторизацию